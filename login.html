<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://tknygjjxcbnvlkwgidfm.supabase.co; base-uri 'self'; form-action 'self'; frame-ancestors 'none"><title>Entrar | UpCorretor</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-shell"><section class="card auth-card"><a class="brand auth-brand" href="landing.html"><span class="brand-mark brand-mark-up"><span>U</span><i></i></span> UpCorretor</a><h1>Bem-vindo de volta</h1><p class="auth-muted">Entre para gerenciar seu site e seus imóveis.</p><form id="login-form"><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button class="button button-primary" type="submit">Entrar</button><p id="feedback" class="auth-feedback" role="status"></p></form><p class="auth-muted">Ainda não tem conta? <a href="cadastro.html">Criar cadastro grátis</a></p></section></main><script src="supabase-client.js"></script><script>document.querySelector('#login-form').addEventListener('submit',async e=>{e.preventDefault();const f=document.querySelector('#feedback');f.textContent='Entrando…';try{await upSignIn(email.value,password.value);location.href='index.html'}catch(err){f.textContent=err.message}})</script></body></html>
