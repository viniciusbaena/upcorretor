<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://tknygjjxcbnvlkwgidfm.supabase.co; base-uri 'self'; frame-ancestors 'none'"><title>Validando | UpCorretor</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3faf6;color:#17352b;font:16px system-ui}main{max-width:480px;margin:20px;padding:38px;text-align:center;background:#fff;border:1px solid #dcebe3;border-radius:22px;box-shadow:0 20px 60px #174b3914}h1{font-size:30px;line-height:1.1}p{color:#657d72;line-height:1.6}a{display:inline-block;margin-top:12px;background:#087f5b;color:#fff;padding:13px 18px;border-radius:10px;text-decoration:none;font-weight:700}</style></head><body><main><div id="icon" style="font-size:42px">⌛</div><h1 id="title">Validando seu acesso…</h1><p id="message">Aguarde enquanto confirmamos seu e-mail com segurança.</p><a id="action" href="login.html" hidden>Entrar no UpCorretor</a></main><script src="supabase-client.js"></script><script>(async()=>{const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));history.replaceState({},'',location.pathname+location.search);const type=params.get('type')||hash.get('type');const token=hash.get('access_token');try{if(token){const auth={access_token:token,refresh_token:hash.get('refresh_token'),expires_at:Number(hash.get('expires_at')||0),user:null};auth.user=await upFetch('/auth/v1/user',{},token);localStorage.setItem(UPCORRETOR_SESSION_KEY,JSON.stringify(auth));await upProvisionAccount(auth);if(type==='recovery'){location.replace('recuperar.html#recovery');return}}document.querySelector('#icon').textContent='✓';document.querySelector('#title').textContent=type==='recovery'?'Acesso recuperado':'E-mail confirmado';document.querySelector('#message').textContent=type==='recovery'?'Agora escolha uma nova senha.':'Sua conta UpCorretor está pronta. Entre no painel para começar.';document.querySelector('#action').hidden=false}catch(e){document.querySelector('#icon').textContent='!';document.querySelector('#title').textContent='Não foi possível validar';document.querySelector('#message').textContent='O link pode ter expirado. Solicite um novo e-mail e tente novamente.';document.querySelector('#action').hidden=false}})();</script></body></html>
