<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://tknygjjxcbnvlkwgidfm.supabase.co; base-uri 'self'; frame-ancestors 'none'"><title>Recuperar acesso | UpCorretor</title><style>[hidden]{display:none!important}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3faf6;color:#17352b;font:16px system-ui}.card{width:min(460px,calc(100% - 32px));padding:36px;background:#fff;border:1px solid #dcebe3;border-radius:22px;box-shadow:0 20px 60px #174b3914}h1{color:#123c30}p{color:#657d72;line-height:1.6}form{display:grid;gap:14px}label{display:grid;gap:7px;font-weight:700;color:#244c3e}input{padding:13px;border:1px solid #d7e4de;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:14px;background:#087f5b;color:#fff;font-weight:800;cursor:pointer}.feedback{min-height:20px}.feedback a{color:#087f5b}</style></head>
<body><main class="card"><a href="index.html">← UpCorretor</a><h1 id="heading">Recupere seu acesso</h1><p id="intro">Informe o e-mail cadastrado. Enviaremos um link seguro para criar uma nova senha.</p><form id="recover-form"><label id="email-field">E-mail<input id="email" type="email" required autocomplete="email" placeholder="voce@exemplo.com"></label><label id="password-field" hidden>Nova senha<input id="password" type="password" minlength="8" autocomplete="new-password"></label><label id="confirm-field" hidden>Repita a senha<input id="password-confirm" type="password" minlength="8" autocomplete="new-password"></label><button type="submit">Enviar link de recuperação</button><p id="feedback" class="feedback" role="status" aria-live="polite"></p></form><p><a href="login.html">Voltar para o login</a></p></main><script src="supabase-client.js"></script><script>
const hasRecovery=location.hash==='#recovery'||localStorage.getItem('upcorretor.recovery')==='1';
const emailField=document.querySelector('#email-field'),passwordField=document.querySelector('#password-field'),confirmField=document.querySelector('#confirm-field'),heading=document.querySelector('#heading'),intro=document.querySelector('#intro'),button=document.querySelector('#recover-form button');
if(hasRecovery){emailField.hidden=true;passwordField.hidden=false;confirmField.hidden=false;heading.textContent='Crie uma nova senha';intro.textContent='Escolha uma senha forte para proteger sua conta.';button.textContent='Salvar nova senha'}
document.querySelector('#recover-form').addEventListener('submit',async e=>{e.preventDefault();const feedback=document.querySelector('#feedback');button.disabled=true;feedback.textContent=hasRecovery?'Salvando…':'Enviando…';try{if(hasRecovery){const password=document.querySelector('#password').value;if(password.length<8||password!==document.querySelector('#password-confirm').value)throw new Error('As senhas devem ter 8 caracteres e ser iguais.');const session=upGetSession();if(!session?.access_token)throw new Error('O link de recuperação expirou. Solicite um novo link.');await upFetch('/auth/v1/user',{method:'PUT',body:JSON.stringify({password})},session.access_token);upSignOut();localStorage.removeItem('upcorretor.recovery');feedback.innerHTML='Senha alterada com sucesso. <a href="login.html">Entrar agora</a>'}else{await upSendPasswordReset(document.querySelector('#email').value);feedback.textContent='Se este e-mail estiver cadastrado, enviaremos as instruções.'}}catch(err){const msg=String(err.message||'');feedback.textContent=/rate limit|too many|exceeded/i.test(msg)?'Aguarde alguns minutos antes de solicitar outro e-mail. Verifique também sua caixa de entrada e a pasta de spam.':(err.message||'Não foi possível concluir.');button.disabled=false}});
</script></body></html>
