<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://tknygjjxcbnvlkwgidfm.supabase.co; base-uri 'self'; form-action 'self'; frame-ancestors 'none"><title>Recuperar acesso | UpCorretor</title><link rel="stylesheet" href="styles.css"><style>.recover-page{min-height:100vh;background:linear-gradient(135deg,#f5faf7,#eef7f3 48%,#fff9ef);display:grid;place-items:center;padding:20px}.recover-card{width:min(460px,100%);box-sizing:border-box;background:#fff;border:1px solid #dcebe3;border-radius:24px;padding:clamp(28px,6vw,52px);box-shadow:0 24px 70px #174b391a}.recover-brand{display:inline-flex;align-items:center;gap:10px;color:#123c30;text-decoration:none;font-weight:800;font-size:20px}.recover-brand .brand-mark{background:#f7be53;color:#103f31}.recover-card h1{color:#123c30;font-size:32px;letter-spacing:-.04em;margin:46px 0 9px}.recover-card p{color:#6b7e76;line-height:1.6}.recover-form{display:grid;gap:14px;margin-top:25px}.recover-form label{display:grid;gap:7px;color:#244c3e;font-size:13px;font-weight:750}.recover-form input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #d7e4de;border-radius:12px;font:inherit}.recover-form input:focus{outline:none;border-color:#168260;box-shadow:0 0 0 4px #1682601f}.recover-btn{border:0;border-radius:12px;padding:14px;background:#087f5b;color:#fff;font:800 15px inherit;cursor:pointer}.recover-feedback{min-height:20px;font-size:13px}.recover-footer{text-align:center;font-size:13px}.recover-footer a{color:#087f5b;font-weight:750}</style></head><body><main class="recover-page"><section class="recover-card"><a class="recover-brand" href="index.html"><span class="brand-mark brand-mark-up"><span>U</span><i></i></span>UpCorretor</a><h1>Recupere seu acesso</h1><p>Informe o e-mail cadastrado. Enviaremos um link seguro para criar uma nova senha.</p><form id="recover-form" class="recover-form"><label>E-mail<input id="email" type="email" required autocomplete="email" placeholder="voce@exemplo.com"></label><button class="recover-btn" type="submit">Enviar link de recuperação</button><p id="feedback" class="recover-feedback" role="status" aria-live="polite"></p></form><p class="recover-footer"><a href="login.html">Voltar para o login</a></p></section></main><script src="supabase-client.js"></script><script>document.querySelector('#recover-form').addEventListener('submit',async e=>{e.preventDefault();const f=document.querySelector('#feedback'),b=e.currentTarget.querySelector('button');b.disabled=true;f.textContent='Enviando…';try{await upSendPasswordReset(document.querySelector('#email').value);f.style.color='#087f5b';f.textContent='Se este e-mail estiver cadastrado, enviaremos as instruções de recuperação.'}catch(err){f.style.color='#a43d32';f.textContent=err.message||'Não foi possível enviar o link.';b.disabled=false}})</script></body></html>
