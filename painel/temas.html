<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'self'"><title>UpCorretor — temas do site</title><link rel="stylesheet" href="../styles.css"></head><body><main class="main-content" style="max-width:1280px;margin:auto"><header class="topbar"><div><p class="eyebrow">PERSONALIZAÇÃO DO SITE</p><h1>Escolha o tema do seu corretor</h1></div><a class="button button-secondary" href="index.html">Voltar ao painel</a></header><section class="card" style="margin-bottom:18px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><input id="searchTheme" placeholder="Buscar tema" style="padding:10px;border:1px solid var(--line);border-radius:8px"><select id="fontTheme" style="padding:10px;border:1px solid var(--line);border-radius:8px"><option value="">Todas as fontes</option><option>Inter</option><option>Sora</option><option>Poppins</option><option>DM Sans</option><option>Montserrat</option></select><label style="font-size:13px;color:var(--muted)">Cor principal <input id="primaryTheme" type="color" value="#1d6b4c"></label><label style="font-size:13px;color:var(--muted)">Fundo <input id="bgTheme" type="color" value="#f5f7f4"></label><label style="font-size:13px;color:var(--muted)">Espaçamento <select id="spacingTheme"><option value="compact">Compacto</option><option value="balanced" selected>Equilibrado</option><option value="airy">Arejado</option></select></label><button id="saveTheme" class="button button-primary">Salvar personalização</button></div></section><section id="themeGrid" class="grid property-grid"></section></main><script src="../themes.js"></script><script src="../supabase-client.js"></script><script>const grid=document.querySelector("#themeGrid"),search=document.querySelector("#searchTheme"),font=document.querySelector("#fontTheme"),primary=document.querySelector("#primaryTheme"),bg=document.querySelector("#bgTheme"),spacing=document.querySelector("#spacingTheme");let selected=window.UPCORRETOR_THEMES[0];function draw(){const q=search.value.toLowerCase();const f=font.value;grid.innerHTML=window.UPCORRETOR_THEMES.filter(t=>(!q||t.name.toLowerCase().includes(q)||t.palette.toLowerCase().includes(q))&&(!f||t.font===f)).map(t=>`<article class="card" data-id="${t.id}" style="cursor:pointer;border:2px solid ${selected.id===t.id?t.primary:"var(--line)"};padding:0;overflow:hidden"><div style="height:130px;background:${t.background};padding:18px;color:${t.text};font-family:${t.font},sans-serif"><div style="font-size:11px;font-weight:800;color:${t.primary}">SEU NOME</div><div style="font-size:22px;font-weight:800;letter-spacing:-.05em;margin-top:30px">Encontre seu novo lugar.</div><div style="height:6px;border-radius:99px;background:${t.surface};margin-top:12px;width:60%"></div></div><div style="padding:15px"><div style="display:flex;justify-content:space-between"><strong>${t.name}</strong><span class="pill">${t.layout}</span></div><small style="color:var(--muted)">${t.font} · ${t.spacing} · ${t.radius}px</small></div></article>`).join("")||`<div class="card empty">Nenhum tema encontrado.</div>`;grid.querySelectorAll("[data-id]").forEach(c=>c.onclick=()=>{selected=window.UPCORRETOR_THEMES.find(t=>t.id===c.dataset.id);primary.value=selected.primary;bg.value=selected.background;spacing.value=selected.spacing;draw()})}search.oninput=draw;font.onchange=draw;document.querySelector("#saveTheme").onclick=()=>{localStorage.setItem("upcorretor.theme",JSON.stringify({...selected,primary:primary.value,background:bg.value,spacing:spacing.value}));const sess=upGetSession();if(sess?.user?.id){const sites=await upFetch(`/rest/v1/sites?owner_id=eq.${encodeURIComponent(sess.user.id)}&select=id`,{},sess.access_token);if(sites[0])await upFetch(`/rest/v1/sites?id=eq.${sites[0].id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({theme_config:{theme_id:selected.id,primary:primary.value,background:bg.value,spacing:spacing.value}})},sess.access_token)}alert("Personalização salva na sua conta.")};draw();</script></body></html>
