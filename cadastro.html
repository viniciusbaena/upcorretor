<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://tknygjjxcbnvlkwgidfm.supabase.co; base-uri 'self'; form-action 'self'; frame-ancestors 'none"><title>Criar conta | UpCorretor</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-shell"><section class="card auth-card"><a class="brand auth-brand" href="landing.html"><span class="brand-mark brand-mark-up"><span>U</span><i></i></span> UpCorretor</a><h1>Crie seu site profissional</h1><p class="auth-muted">Comece grátis e personalize sua presença digital.</p><form id="signup-form"><label>Seu nome<input id="fullName" required autocomplete="name"></label><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Nome do site<input id="siteName" required placeholder="Ex.: João Silva Imóveis"></label><label>Endereço do site<input id="slug" required pattern="[a-z0-9-]{3,40}" placeholder="joao-silva"></label><button class="button button-primary" type="submit">Criar minha conta</button><p id="feedback" class="auth-feedback" role="status"></p></form><p class="auth-muted">Já tem conta? <a href="login.html">Entrar</a></p></section></main><script src="supabase-client.js"></script><script>document.querySelector('#signup-form').addEventListener('submit',async e=>{e.preventDefault();const f=document.querySelector('#feedback');f.textContent='Criando conta…';try{const r=await upSignUp({email:email.value,password:password.value,fullName:fullName.value,siteName:siteName.value,slug:slug.value});if(r.needsEmailConfirmation){f.textContent='Conta criada. Confirme seu e-mail para entrar.'}else{location.href='index.html'}}catch(err){f.textContent=err.message}})</script></body></html>
